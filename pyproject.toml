[project]
name = "kha-device"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16,<3.17",
    "drf-spectacular>=0.28,<0.29",
    "psycopg[binary]>=3.2,<3.3",
]

[tool.ruff]
extend-exclude = ["monitoring/migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "ruff>=0.14,<1",
]

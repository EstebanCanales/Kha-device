<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Entrar · Kha-device 01</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Michroma&display=swap" rel="stylesheet" />
	<style>
		:root { color-scheme: dark; --sky:#070b17; --regolith:#d9d5d0; --soft:#a9adb8; --dim:#8790a4; --line:#323b55; --ocean:#6fa8ff; --coral:#f46e68; }
		* { box-sizing: border-box; }
		body { margin:0; min-height:100svh; display:grid; place-items:center; padding:1.5rem; background:var(--sky); color:var(--regolith); font-family:'IBM Plex Mono', ui-monospace, monospace; }
		main { width:min(24rem, 100%); }
		h1 { margin:0 0 .25rem; font:400 1.6rem/1.1 'Michroma', sans-serif; letter-spacing:.04em; text-transform:uppercase; }
		h1 span { display:block; color:var(--dim); }
		p { color:var(--soft); font-size:.9rem; line-height:1.6; }
		label { display:block; margin:1.25rem 0 .4rem; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
		input { width:100%; padding:.7rem .8rem; border:1px solid var(--line); background:transparent; color:inherit; font:inherit; }
		input:focus-visible, button:focus-visible, a:focus-visible { outline:1px solid var(--ocean); outline-offset:3px; }
		button { width:100%; margin-top:1.75rem; padding:.8rem; border:1px solid var(--soft); background:none; color:inherit; font:inherit; cursor:pointer; letter-spacing:.08em; text-transform:uppercase; }
		button:hover { border-color:var(--regolith); }
		.error { margin:1rem 0 0; color:var(--coral); }
		a { color:var(--dim); font-size:.8rem; }
	</style>
</head>
<body>
	<main>
		<h1>Kha-device <span>01</span></h1>
		<p>Entra con tu cuenta para ver las sesiones que tienes asignadas.</p>
		<form method="post">
			{% csrf_token %}
			<label for="id_username">Usuario</label>
			<input id="id_username" name="username" autocomplete="username" required autofocus />
			<label for="id_password">Contraseña</label>
			<input id="id_password" name="password" type="password" autocomplete="current-password" required />
			{% if form.errors %}<p class="error" role="alert">Usuario o contraseña incorrectos.</p>{% endif %}
			<input type="hidden" name="next" value="{{ next }}" />
			<button type="submit">Entrar</button>
		</form>
	</main>
</body>
</html>

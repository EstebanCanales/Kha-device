{% load static %}<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>{% block title %}Entrar{% endblock %} · Kha-device 01</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
	<link rel="icon" type="image/png" href="{% static 'monitoring/klaskha.png' %}" />
	<style>
		:root { color-scheme: dark; --bg:#070a12; --panel:#121823; --line:#263040; --text:#e6eaf0; --muted:#98a2b3; --faint:#6b7686; --accent:#4f8cff; --neg:#ef5b5b; --gold:#d8b46a; }
		* { box-sizing: border-box; }
		html, body { height: 100%; }
		body { margin:0; min-height:100svh; display:grid; align-items:start; padding:1.5rem clamp(1.25rem, 7vw, 6rem); background:radial-gradient(60rem 36rem at 72% 46%, #0c1430 0%, #070b17 70%); color:var(--text); font:400 14px/1.5 'Inter', system-ui, sans-serif; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
		#bg { position:fixed; inset:0; z-index:0; pointer-events:none; opacity:.9; animation:sky 1.6s ease both; }
		@keyframes sky { from { opacity:0; } to { opacity:.9; } }
		@keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
		main { animation:rise .7s cubic-bezier(.2,.7,.2,1) .15s both; margin-block:auto; overflow:hidden; transition:height .45s cubic-bezier(.2,.8,.2,1); position:relative; z-index:1; width:min(26rem, 100%); padding:2rem; background:rgba(14, 20, 31, .82); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border:1px solid var(--line); border-radius:14px; box-shadow:0 30px 80px -30px #000; }
		.brand { display:flex; align-items:center; gap:.8rem; margin-bottom:1.5rem; text-decoration:none; color:inherit; }
		.brand img { width:3rem; height:3rem; border-radius:50%; background:#fff; padding:2px; }
		.brand b { display:block; font-size:1.05rem; font-weight:600; }
		.brand span { color:var(--faint); font-size:.78rem; }
		h1 { margin:0 0 .3rem; font-size:1.25rem; font-weight:600; }
		p { margin:0; color:var(--muted); font-size:.86rem; }
		label { display:block; margin:1.1rem 0 .35rem; font-size:.78rem; font-weight:500; color:var(--muted); }
		input { width:100%; padding:.65rem .75rem; border:1px solid var(--line); border-radius:8px; background:rgba(7, 10, 18, .7); color:inherit; font:inherit; transition:border-color .2s ease, box-shadow .2s ease, background .2s ease; }
		input:hover { border-color:#36445c; }
		input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(79, 140, 255, .22); background:rgba(7, 10, 18, .9); }
		input:focus-visible, button:focus-visible, a:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
		.help { margin:.35rem 0 0; font-size:.72rem; color:var(--faint); }
		.help ul { margin:.3rem 0 0; padding-left:1.1rem; }
		button { width:100%; margin-top:1.5rem; padding:.7rem; border:0; border-radius:8px; background:linear-gradient(90deg, var(--accent), #8a6cf0); color:#fff; font:inherit; font-weight:500; cursor:pointer; transition:filter .2s ease, transform .15s ease, box-shadow .2s ease; box-shadow:0 10px 24px -14px rgba(110, 120, 255, .9); }
		button:active { transform:translateY(1px) scale(.995); }
		button:hover { filter:brightness(1.12); }
		.error { margin:.35rem 0 0; color:var(--neg); font-size:.78rem; }
		.alt { margin-top:1.25rem; text-align:center; font-size:.8rem; color:var(--faint); }
		a { color:#8fb4ff; text-decoration:none; }
		a:hover { text-decoration:underline; }
		#panel { transition:opacity .22s ease, transform .22s ease, filter .22s ease; }
		#panel.is-out { opacity:0; transform:translateY(8px) scale(.985); filter:blur(3px); }
		/* Tras el cambio, el contenido entra por partes: título, texto, campos y botón. */
		#panel.is-in > *, #panel.is-in form > * { animation:rise .45s cubic-bezier(.2,.7,.2,1) both; }
		#panel.is-in > :nth-child(2) { animation-delay:.04s; }
		#panel.is-in form > :nth-child(n+3) { animation-delay:.08s; }
		#panel.is-in form > :nth-child(n+5) { animation-delay:.13s; }
		#panel.is-in form > :nth-child(n+7) { animation-delay:.18s; }
		#panel.is-in form > :nth-child(n+9) { animation-delay:.23s; }
		#panel.is-in > .alt { animation-delay:.28s; }
		#planetName { display:inline-block; transition:opacity .26s ease, transform .26s ease; }
		#planetName.is-out { opacity:0; transform:translateY(4px); }
		.note { position:fixed; z-index:1; right:clamp(1rem, 3vw, 2rem); bottom:1rem; font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); }
		@media (prefers-reduced-motion: reduce) { #bg, main, #panel.is-in > *, #panel.is-in form > * { animation:none; } #panel, #planetName, input, button, main { transition:none; } }
		@media (max-width: 900px) { body { justify-items:center; } .note { display:none; } main { background:rgba(14, 20, 31, .9); } }
	</style>
</head>
<body data-planet="{% block planet %}moon{% endblock %}">
	<canvas id="bg" aria-hidden="true"></canvas>
	<main>
		<a class="brand" href="/app/"><img src="{% static 'monitoring/klaskha.png' %}" alt="Klaskha" width="48" height="48" /><div><b>Kha-device 01</b><span>Monitoreo de astronauta</span></div></a>
		<div id="panel">
{% block content %}{% endblock %}
		</div>
	</main>
	<p class="note" aria-hidden="true">Sistema solar en ASCII · <span id="planetName">Mercurio</span></p>
	<script src="{% static 'monitoring/ascii-bg.js' %}"></script>
</body>
</html>
